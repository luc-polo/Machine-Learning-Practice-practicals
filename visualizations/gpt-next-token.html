<div id="gpt-next-token">
  <style>
    #gpt-next-token {
      --gpt-line: color-mix(in srgb, var(--foreground) 28%, var(--background));
      --gpt-soft: color-mix(in srgb, var(--viz-series-1) 12%, var(--background));
      --gpt-strong: var(--viz-series-1);
      color: var(--foreground);
      display: grid;
      gap: calc(var(--font-size-base) * 1.25);
      width: 100%;
    }
    #gpt-next-token .gpt-title {
      max-width: calc(100% - 96px);
    }
    #gpt-next-token .gpt-flow {
      display: grid;
      grid-template-columns: minmax(92px, .8fr) 34px minmax(150px, 1.2fr) 34px minmax(210px, 1.7fr) 34px minmax(92px, .8fr);
      align-items: center;
      gap: calc(var(--font-size-base) * .3);
    }
    #gpt-next-token .gpt-stage {
      min-width: 0;
      display: grid;
      justify-items: center;
      align-content: center;
      gap: calc(var(--font-size-base) * .5);
      text-align: center;
    }
    #gpt-next-token .gpt-caption {
      color: var(--muted-foreground);
    }
    #gpt-next-token .gpt-prompt,
    #gpt-next-token .gpt-next {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-weight: 500;
      padding: calc(var(--font-size-base) * .6) calc(var(--font-size-base) * .75);
      background: var(--muted);
      color: var(--foreground);
      border-radius: 8px;
      white-space: nowrap;
    }
    #gpt-next-token .gpt-next {
      background: var(--gpt-strong);
      color: var(--background);
    }
    #gpt-next-token .gpt-model {
      position: relative;
      width: 116px;
      height: 92px;
    }
    #gpt-next-token .gpt-layer {
      position: absolute;
      left: 8px;
      width: 96px;
      height: 52px;
      border: 1px solid var(--gpt-line);
      border-radius: 7px;
      background: var(--background);
    }
    #gpt-next-token .gpt-layer:nth-child(1) { top: 4px; left: 20px; }
    #gpt-next-token .gpt-layer:nth-child(2) { top: 14px; left: 14px; }
    #gpt-next-token .gpt-layer:nth-child(3) { top: 24px; }
    #gpt-next-token .gpt-label {
      position: absolute;
      left: 8px;
      top: 24px;
      width: 96px;
      height: 52px;
      display: grid;
      place-content: center;
      gap: 2px;
      font-weight: 500;
    }
    #gpt-next-token .gpt-label small {
      color: var(--muted-foreground);
      font-weight: 400;
    }
    #gpt-next-token .gpt-arrow {
      color: var(--gpt-line);
      width: 100%;
      height: 22px;
    }
    #gpt-next-token .gpt-arrow line,
    #gpt-next-token .gpt-arrow path {
      vector-effect: non-scaling-stroke;
    }
    #gpt-next-token .gpt-head {
      width: 100%;
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: center;
      gap: calc(var(--font-size-base) * .7);
    }
    #gpt-next-token .gpt-linear {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      padding: calc(var(--font-size-base) * .5) calc(var(--font-size-base) * .35);
      border-left: 3px solid var(--gpt-strong);
      background: var(--gpt-soft);
      font-weight: 500;
      border-radius: 5px;
    }
    #gpt-next-token .gpt-outputs {
      display: grid;
      grid-template-columns: repeat(4, minmax(34px, 1fr));
      gap: calc(var(--font-size-base) * .35);
    }
    #gpt-next-token .gpt-logit {
      display: grid;
      gap: 2px;
      justify-items: center;
      padding: calc(var(--font-size-base) * .35) calc(var(--font-size-base) * .2);
      border-bottom: 3px solid var(--gpt-line);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    #gpt-next-token .gpt-logit span:last-child {
      color: var(--muted-foreground);
    }
    #gpt-next-token .gpt-logit.is-winner {
      border-color: var(--gpt-strong);
      background: var(--gpt-soft);
      border-radius: 5px 5px 0 0;
      font-weight: 500;
    }
    #gpt-next-token .gpt-note {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: calc(var(--font-size-base) * .5);
      color: var(--muted-foreground);
    }
    #gpt-next-token .gpt-loop {
      width: 42px;
      height: 18px;
      color: var(--gpt-line);
      flex: 0 0 auto;
    }
    @media (max-width: 640px) {
      #gpt-next-token .gpt-title { max-width: 100%; }
      #gpt-next-token .gpt-flow {
        grid-template-columns: 1fr;
        gap: calc(var(--font-size-base) * .65);
      }
      #gpt-next-token .gpt-arrow {
        width: 22px;
        height: 30px;
        justify-self: center;
        transform: rotate(90deg);
      }
      #gpt-next-token .gpt-stage { gap: calc(var(--font-size-base) * .35); }
      #gpt-next-token .gpt-head { max-width: 290px; }
    }
  </style>

  <div class="gpt-title">
    <h2>GPT predicts one next token</h2>
  </div>

  <div class="gpt-flow" role="img" aria-label="The input tokens pass through the decoder-only GPT, then a final linear layer produces one score for every vocabulary token. Greedy decoding selects the highest-scoring token as the single next token.">
    <section class="gpt-stage">
      <div class="gpt-prompt">12 × 3 =</div>
      <div class="gpt-caption">input tokens</div>
    </section>

    <svg class="gpt-arrow" viewBox="0 0 34 22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5">
      <line x1="1" y1="11" x2="29" y2="11"/>
      <path d="M24 6l5 5-5 5"/>
    </svg>

    <section class="gpt-stage">
      <div class="gpt-model" aria-hidden="true">
        <div class="gpt-layer"></div>
        <div class="gpt-layer"></div>
        <div class="gpt-layer"></div>
        <div class="gpt-label">GPT<small>decoder-only</small></div>
      </div>
      <div class="gpt-caption">many Transformer layers</div>
    </section>

    <svg class="gpt-arrow" viewBox="0 0 34 22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5">
      <line x1="1" y1="11" x2="29" y2="11"/>
      <path d="M24 6l5 5-5 5"/>
    </svg>

    <section class="gpt-stage">
      <div class="gpt-head">
        <div class="gpt-linear">Linear layer</div>
        <div class="gpt-outputs" aria-label="Example vocabulary scores">
          <div class="gpt-logit"><span>0</span><span>0.01</span></div>
          <div class="gpt-logit"><span>1</span><span>0.02</span></div>
          <div class="gpt-logit"><span>2</span><span>0.04</span></div>
          <div class="gpt-logit is-winner"><span>3</span><span>0.70</span></div>
          <div class="gpt-logit"><span>4</span><span>0.03</span></div>
          <div class="gpt-logit"><span>5</span><span>0.01</span></div>
          <div class="gpt-logit"><span>…</span><span>…</span></div>
          <div class="gpt-logit"><span>#</span><span>0.01</span></div>
        </div>
      </div>
      <div class="gpt-caption"><strong>V outputs</strong> = one score per vocabulary token</div>
    </section>

    <svg class="gpt-arrow" viewBox="0 0 34 22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5">
      <line x1="1" y1="11" x2="29" y2="11"/>
      <path d="M24 6l5 5-5 5"/>
    </svg>

    <section class="gpt-stage">
      <div class="gpt-next">3</div>
      <div class="gpt-caption">one next token</div>
    </section>
  </div>

  <div class="gpt-note">
    <svg class="gpt-loop" viewBox="0 0 42 18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M40 4H12a8 8 0 0 0-8 8v2"/>
      <path d="M1 10l3 4 4-4"/>
    </svg>
    Append <code>3</code> to the input, then repeat for the following token.
  </div>
</div>
